# CI/CD de la API de producción: pruebas, gates de seguridad y build reproducible del contenedor.
# Corre sin credenciales reales: LLM_FALSO=1 hace que los agentes respondan de forma determinista.
name: ci-produccion

on:
  push:
    branches: [main, m4-produccion]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pruebas:
    name: Pruebas de la API (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: produccion/requirements*.txt
      - run: pip install -r produccion/requirements-dev.txt
      - run: python -m pytest produccion/tests -q

  seguridad:
    name: Gates de seguridad (bandit, pip-audit, gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit==1.8.6 pip-audit==2.9.0
      - name: Análisis estático (falla con severidad media o alta)
        run: bandit -r produccion -x produccion/tests -ll
      - name: Vulnerabilidades conocidas en dependencias
        run: pip-audit -r produccion/requirements.txt --progress-spinner off
      - name: Secretos en el historial de Git
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  contenedor:
    name: Build y prueba de humo del contenedor
    runs-on: ubuntu-latest
    needs: [pruebas]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build de la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: fabrica-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Levantar el contenedor endurecido (read-only, sin capacidades, usuario no root)
        run: |
          docker run -d --name api -p 8000:8000 --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true --tmpfs /datos:uid=999,gid=999 \
            -e LLM_FALSO=1 -e LANGSMITH_TRACING=false -e API_KEYS=cliente:ci-cliente,lector:ci-lector \
            fabrica-api:ci
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && break; sleep 2; done
      - name: Prueba de humo
        run: |
          set -e
          curl -sf http://localhost:8000/health | tee /dev/stderr | grep -q '"ok"'
          curl -sf http://localhost:8000/ready | tee /dev/stderr | grep -q '"listo":true'
          curl -sf http://localhost:8000/openapi.json > /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8000/v1/criterios \
                 -H 'Content-Type: application/json' -d '{"historia":"x"}')" = "401"
          python3 - <<'EOF'
          import json, urllib.request
          historia = open("historias/HU-10-solicitar-vacaciones.md", encoding="utf-8").read()
          req = urllib.request.Request("http://localhost:8000/v1/criterios", method="POST",
                                       data=json.dumps({"historia": historia}).encode(),
                                       headers={"Content-Type": "application/json", "X-API-Key": "ci-cliente"})
          r = json.load(urllib.request.urlopen(req, timeout=60))
          assert r["hu"] == "HU-10" and r["casos"], r
          print("POST /v1/criterios OK:", r["hu"], len(r["casos"]), "casos")
          EOF
          docker exec api id -u | grep -vq '^0$'
          echo "Usuario no root y sistema de archivos de solo lectura: OK"
      - name: Logs del contenedor
        if: always()
        run: docker logs api | tail -n 30
      - name: Publicar imagen en GitHub Container Registry
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          IMG=ghcr.io/${{ github.repository_owner }}/m3-fabrica-agentes-api
          docker tag fabrica-api:ci $IMG:${{ github.sha }}
          docker tag fabrica-api:ci $IMG:latest
          docker push $IMG:${{ github.sha }}
          docker push $IMG:latest
